[build]
  # Static directory to publish
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# If you deploy the Python Flask backend (server.py) to a free cloud service
# like Render, Railway, or Fly.io, you can uncomment this redirect rule:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-app.onrender.com/api/:splat"
#   status = 200
